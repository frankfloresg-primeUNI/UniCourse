<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniCourse</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>UniCourse</h1>
        <p>Conoce mejor tus cursos antes de matricularte.</p>
    </header>

    <main>
        <h2>Cursos</h2>
        <h2>Agregar curso</h2>

        <form id="course-form">

            <input
                type="text"
                id="name"
                placeholder="Nombre del curso"
                required
            >

            <input
                type="text"
                id="professor"
                placeholder="Profesor"
                required
            >

            <input
                type="number"
                id="rating"
                placeholder="Rating"
                min="0"
                max="5"
                step="0.1"
                required
            >

            <input
                type="text"
                id="description"
                placeholder="Descripción"
                required
            >

            <input
                type="text"
                id="advice"
                placeholder="Consejo"
                required
            >

            <button type="submit">
                Agregar curso
            </button>

        </form>
        <input 
            type="text" 
            id="search"
            placeholder="Buscar curso..."
        >

        <div id="courses-container"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
